name: BMS & DISTRICT INTERESTS TRACKER

on:
  schedule:
    # Hourly tracking (every hour at minute 15)
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: interests-tracker-${{ github.ref }}
  cancel-in-progress: false

# 🌍 GLOBAL ENV - REPOSITORY CONFIGURATION
env:
  DATA_REPO: MintBox04/bmsinterests

permissions:
  contents: write

jobs:

# =====================================================
# 1️⃣ TRACK & PROCESS (BMS + District -> /data in MintBox04/bmsinterests)
# =====================================================
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # 1. Clone Target Repository (MintBox04/bmsinterests)
      - name: Clone BMS Interests Repository
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git repo
          else
            git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.DATA_REPO }}.git repo
          fi

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          pip install --no-cache-dir curl-cffi requests pytz cloudscraper

      # 4a. Cache Cloudflare WARP Package
      - name: Cache Cloudflare WARP Package
        id: warp-cache
        uses: actions/cache@v4
        with:
          path: ~/.apt-warp-cache/cloudflare-warp.deb
          key: ${{ runner.os }}-cloudflare-warp-direct-v2

      # 4b. Setup Cloudflare WARP (Direct Binary Extraction - Zero APT / Zero Mirrors)
      - name: Setup Cloudflare WARP
        timeout-minutes: 2
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "📍 IP BEFORE WARP: $(curl -s https://api.ipify.org || curl -s https://ifconfig.me || echo 'Unknown')"
          echo "=================================================="

          mkdir -p ~/.apt-warp-cache
          WARP_DEB="$HOME/.apt-warp-cache/cloudflare-warp.deb"

          # 1. Download directly from Cloudflare global CDN if not in cache (No apt-get / No mirrors)
          if [ ! -s "$WARP_DEB" ]; then
            echo "📥 Downloading Cloudflare WARP deb directly..."
            curl -fsSL --retry 3 --connect-timeout 10 "https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.8.2115.0_amd64.deb" -o "$WARP_DEB" || true
          fi

          # 2. Extract binaries directly using dpkg-deb (Bypasses APT completely)
          if [ -s "$WARP_DEB" ]; then
            sudo dpkg-deb -x "$WARP_DEB" /
            sudo systemctl daemon-reload 2>/dev/null || true
            sudo systemctl start warp-svc.service || sudo service warp-svc start || true
            sleep 2

            warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
            warp-cli --accept-tos mode warp 2>/dev/null || warp-cli --accept-tos set-mode warp 2>/dev/null || true
            warp-cli --accept-tos connect 2>/dev/null || true
            sleep 3
          else
            echo "⚠️ Cloudflare WARP package not available, continuing with direct runner IP..."
          fi

          echo "=================================================="
          echo "🚀 IP AFTER WARP: $(curl -s https://api.ipify.org || curl -s https://ifconfig.me || echo 'Unknown')"
          echo "=================================================="

      # 5. Run BMS & District Scrapers & Save to /data
      - name: Run BMS & District Scrapers
        run: |
          cd repo
          mkdir -p data
          echo "🎬 Running BMS Interests Scraper..."
          python bmsinterests.py --city hyderabad --worker-url "${{ secrets.WORKER_URL || env.WORKER_URL }}" --data-dir "data" || echo "⚠️ BMS Scraper encountered an error, continuing to District..."

          echo "🍿 Running District Upcoming & Hype Scraper..."
          python districtinterests.py --data-dir "data" || echo "⚠️ District Scraper encountered an error..."

      # 6. Commit & Push /data to MintBox04/bmsinterests (With Auto-Rebase Retry)
      - name: Push Data to GitHub Repository
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all data files (bms_latest, bms_history, district_latest, district_history)
          git add data/

          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Update BMS & District Interests Telemetry - $CURRENT_TIME" || echo "No changes to commit"

          for i in {1..15}; do
            echo "Push attempt $i/15 to ${{ env.DATA_REPO }}..."
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "✅ Successfully pushed /data to ${{ env.DATA_REPO }}"
              break
            fi
            sleep $((RANDOM % 5 + 3))
          done
