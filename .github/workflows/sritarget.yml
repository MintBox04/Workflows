name: SRILANKA TARGET DATE

on:
  schedule:
    - cron: '*/40 * * * *'   # runs every 40 minutes
  workflow_dispatch:          # also allow manual trigger

# 🔥 prevent overlapping runs
concurrency:
  group: srilanka-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # 4-hour job cap

    strategy:
      fail-fast: false
      matrix:
        date: ["20260814"]

    env:
      REPO: MintBox04/srilanka
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 🐍 Setup Python
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 📦 Install dependencies (Force install playwright)
      - name: Install dependencies
        run: |
          cd srilanka
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install playwright

      # 💾 Cache Playwright browsers
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('srilanka/requirements.txt') }}-${{ steps.setup-python.outputs.python-version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 📥 Install Playwright Chromium with dependencies
      - name: Install Playwright Chromium
        run: |
          cd srilanka
          python -m playwright install chromium --with-deps

      # 🎬 Run scraper
      - name: Run scraper
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          cd srilanka
          RUN_DATE="${{ matrix.date }}"
          MODE="advance"
          echo "🎬 Sri Lanka Scraper (srilanka.py) — mode=$MODE date=$RUN_DATE"
          for i in {1..6}; do
            echo "Attempt $i"
            if python srilanka.py --mode "$MODE" --date "$RUN_DATE"; then
              echo "✅ Scraper finished successfully"
              break
            fi
            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          cd srilanka
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 🧹 Clean up pycache and png files
          find . -name "*.pyc" -delete || true
          find . -name "__pycache__" -type d -exec rm -rf {} + || true
          git rm -rf --cached __pycache__ 2>/dev/null || true
          rm -f *.png || true

          git add data/ venues.json || true
          git commit -m "target=${{ matrix.date }} advance ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -name "__pycache__" -type d -exec rm -rf {} + || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi

            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
