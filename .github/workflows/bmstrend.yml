name: BMS HOURLY TREND TRACKER

on:
  schedule:
    # Runs every hour at minute 2 (between 0 and 5 minutes)
    - cron: "2 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-hourly-trend-${{ github.ref }}
  cancel-in-progress: false

# 🌍 GLOBAL ENV - SINGLE REPOSITORY CONFIGURATION (Code & Data in bmsTrend)
env:
  DATA_REPO: MintBox04/bmsTrend

jobs:
  track_trend:
    name: Track BMS Hourly Trends (All-India)
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Setup Python
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # 2. Install Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      # -------------------------------------------------
      # 3. Compute Date Code (IST)
      # -------------------------------------------------
      - name: Compute Date Code
        run: |
          DATE_CODE=$(python -c "from datetime import datetime, timedelta, timezone; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y%m%d'))")
          echo "DATE_CODE=$DATE_CODE" >> $GITHUB_ENV
          echo "🎯 Target Date Code: $DATE_CODE"

      # -------------------------------------------------
      # 4. Clone Repository (MintBox04/bmsTrend)
      # -------------------------------------------------
      - name: Clone bmsTrend Repository
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git bms_repo
          cd bms_repo
          echo "Files in ${{ env.DATA_REPO }}:"
          ls -la

      # -------------------------------------------------
      # 5. Run Trend Tracker Inside Repository
      # -------------------------------------------------
      - name: Run Trend Tracker
        run: |
          cd bms_repo

          # Locate trend.py inside bms_repo
          SCRIPT_PATH=""
          if [ -f "bmstrend/trend.py" ]; then
            SCRIPT_PATH="bmstrend/trend.py"
          elif [ -f "trend.py" ]; then
            SCRIPT_PATH="trend.py"
          else
            SCRIPT_PATH=$(find . -name "trend.py" | head -n 1)
          fi

          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ Error: Could not find trend.py in ${{ env.DATA_REPO }}"
            exit 1
          fi

          echo "🚀 Executing $SCRIPT_PATH..."
          python "$SCRIPT_PATH" --output-dir data

          # Ensure dashboard is copied to root index.html
          if [ -f "data/dashboard.html" ]; then
            cp data/dashboard.html index.html
          elif [ -f "bmstrend/index.html" ]; then
            cp bmstrend/index.html index.html
          fi

      # -------------------------------------------------
      # 6. Commit & Push Data to MintBox04/bmsTrend (Auto-Rebase Retry)
      # -------------------------------------------------
      - name: Push Data to MintBox04/bmsTrend
        run: |
          cd bms_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ index.html || git add .
          git commit -m "Update BMS Hourly Trends ($DATE_CODE - $(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          for i in {1..20}; do
            echo "Push attempt $i to ${{ env.DATA_REPO }}..."
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "✅ Final BMS trend data successfully pushed to ${{ env.DATA_REPO }}"
              break
            fi
            sleep 5
          done

      # -------------------------------------------------
      # 7. Fast Direct Deploy to Cloudflare Pages (Optional)
      # -------------------------------------------------
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          cd bms_repo
          npx wrangler pages project create bmstrend --production-branch=main || true
          npx wrangler pages deploy data --project-name=bmstrend --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
