name: BMS HOURLY TREND TRACKER

on:
  workflow_dispatch:

concurrency:
  group: bms-hourly-trend-${{ github.ref }}
  cancel-in-progress: false

# 🌍 GLOBAL ENV - SINGLE REPOSITORY CONFIGURATION (Code & Data in bmsTrend)
env:
  DATA_REPO: MintBox04/bmsTrend

jobs:
  track_trend:
    name: Track BMS Hourly Trends (All-India)
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Checkout Source Repository (InterestsTracking)
      # -------------------------------------------------
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2. Setup Python 3.11 with pip cache
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -------------------------------------------------
      # 3. Install Required Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi requests pytz cloudscraper

      # -------------------------------------------------
      # 4a. Cache Cloudflare WARP Package
      # -------------------------------------------------
      - name: Cache Cloudflare WARP Package
        id: warp-cache
        uses: actions/cache@v4
        with:
          path: ~/.apt-warp-cache
          key: ${{ runner.os }}-cloudflare-warp-apt-v1
          restore-keys: |
            ${{ runner.os }}-cloudflare-warp-apt-

      # -------------------------------------------------
      # 4b. Setup Cloudflare WARP (Bypasses Datacenter IP Blocks for BMS)
      # -------------------------------------------------
      - name: Setup Cloudflare WARP
        run: |
          echo "=================================================="
          echo "📍 IP BEFORE WARP: $(curl -s https://api.ipify.org || curl -s https://ifconfig.me || echo 'Unknown')"
          echo "=================================================="

          # Restore cached deb packages to APT archives
          sudo cp ~/.apt-warp-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true

          # Download GPG Key with retries
          for i in {1..5}; do
            if curl -fsSL --retry 3 --retry-delay 2 https://pkg.cloudflareclient.com/pubkey.gpg -o /tmp/cloudflare.gpg && [ -s /tmp/cloudflare.gpg ]; then
              sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg /tmp/cloudflare.gpg
              break
            fi
            echo "Retrying Cloudflare GPG key download ($i/5)..."
            sleep 2
          done

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # Install WARP with retries
          for i in {1..3}; do
            if sudo apt-get update && sudo apt-get install -y cloudflare-warp; then
              break
            fi
            sleep 3
          done

          # Save downloaded debs to cache directory
          mkdir -p ~/.apt-warp-cache
          cp /var/cache/apt/archives/*.deb ~/.apt-warp-cache/ 2>/dev/null || true

          sudo systemctl start warp-svc.service || sudo service warp-svc start || true
          sleep 2

          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos mode warp 2>/dev/null || warp-cli --accept-tos set-mode warp 2>/dev/null || true
          warp-cli --accept-tos connect 2>/dev/null || true
          sleep 4

          echo "=================================================="
          echo "🚀 IP AFTER WARP: $(curl -s https://api.ipify.org || curl -s https://ifconfig.me || echo 'Unknown')"
          echo "=================================================="

      # -------------------------------------------------
      # 5. Compute Date Code (IST)
      # -------------------------------------------------
      - name: Compute Date Code
        run: |
          DATE_CODE=$(python -c "from datetime import datetime, timedelta, timezone; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y%m%d'))")
          echo "DATE_CODE=$DATE_CODE" >> $GITHUB_ENV
          echo "🎯 Target Date Code: $DATE_CODE"

      # -------------------------------------------------
      # 6. Clone Target Repository (MintBox04/bmsTrend)
      # -------------------------------------------------
      - name: Clone bmsTrend Repository
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git bms_repo
          else
            git clone --depth 1 https://github.com/${{ env.DATA_REPO }}.git bms_repo
          fi
          cd bms_repo
          echo "Files in ${{ env.DATA_REPO }}:"
          ls -la

      # -------------------------------------------------
      # 7. Run Trend Tracker Inside Repository
      # -------------------------------------------------
      - name: Run Trend Tracker
        run: |
          # Sync the latest trend.py and bmsinterests.py from source repo to bms_repo
          cp -f trend.py bms_repo/ 2>/dev/null || true
          cp -f bmsinterests.py bms_repo/ 2>/dev/null || true

          cd bms_repo

          # Locate trend.py
          SCRIPT_PATH="trend.py"
          if [ ! -f "$SCRIPT_PATH" ]; then
            SCRIPT_PATH=$(find . -name "trend.py" | head -n 1)
          fi

          echo "🚀 Executing $SCRIPT_PATH..."
          python "$SCRIPT_PATH" --output-dir data

          # Ensure dashboard is copied to root index.html
          if [ -f "data/dashboard.html" ]; then
            cp -f data/dashboard.html index.html
          elif [ -f "index.html" ]; then
            echo "Root index.html already updated."
          fi

      # -------------------------------------------------
      # 8. Commit & Push Data to MintBox04/bmsTrend (Auto-Rebase Retry)
      # -------------------------------------------------
      - name: Push Data to MintBox04/bmsTrend
        run: |
          cd bms_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ index.html || git add .
          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Update BMS Hourly Trends ($DATE_CODE - $CURRENT_TIME) [skip ci]" || echo "No changes to commit"

          for i in {1..20}; do
            echo "Push attempt $i/20 to ${{ env.DATA_REPO }}..."
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "✅ Final BMS trend data successfully pushed to ${{ env.DATA_REPO }}"
              break
            fi
            sleep $((RANDOM % 5 + 3))
          done

      # -------------------------------------------------
      # 9. Fast Direct Deploy to Cloudflare Pages (Optional)
      # -------------------------------------------------
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⚡ Cloudflare credentials not provided. Skipping Cloudflare Pages deployment."
            exit 0
          fi
          cd bms_repo
          npx wrangler pages project create bmstrend --production-branch=main || true
          npx wrangler pages deploy data --project-name=bmstrend --branch=main --commit-dirty=true
