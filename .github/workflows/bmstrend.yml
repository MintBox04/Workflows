name: BMS HOURLY TREND TRACKER

on:
  schedule:
    # Runs every hour at minute 2 (between 0 and 5 minutes)
    - cron: "2 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-hourly-trend-${{ github.ref }}
  cancel-in-progress: false

# 🌍 GLOBAL ENV - REPOSITORY CONFIGURATION
env:
  DATA_REPO: MintBox04/bmsTrend

jobs:
  track_trend:
    name: Track BMS Hourly Trends (All-India)
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Checkout Code Repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # -------------------------------------------------
      # 2. Setup Python
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # 3. Install Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      # -------------------------------------------------
      # 4. Compute Date Code (IST)
      # -------------------------------------------------
      - name: Compute Date Code
        run: |
          DATE_CODE=$(python -c "from datetime import datetime, timedelta, timezone; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y%m%d'))")
          echo "DATE_CODE=$DATE_CODE" >> $GITHUB_ENV
          echo "🚀 Running BMS Trend Tracker for Date Code: $DATE_CODE"

      # -------------------------------------------------
      # 5. Fast Clone Data Repository (MintBox04/bmsTrend)
      # -------------------------------------------------
      - name: Clone Data Repository
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git data_repo || {
            echo "Creating fallback data_repo directory"
            mkdir -p data_repo
            cd data_repo
            git init
            git remote add origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git
          }

      # -------------------------------------------------
      # 6. Run Scraper Pipeline
      # -------------------------------------------------
      - name: Run BMS Trend Scraper
        run: |
          python bmstrend/trend.py --output-dir data_repo/data

          # Place dashboard at root of data_repo as index.html for instant viewing
          cp bmstrend/index.html data_repo/index.html 2>/dev/null || true

      # -------------------------------------------------
      # 7. Commit & Push Data to MintBox04/bmsTrend (With Auto-Rebase Retry)
      # -------------------------------------------------
      - name: Push Data to Data Repo
        run: |
          cd data_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update BMS Hourly Trends ($DATE_CODE - $(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          for i in {1..20}; do
            echo "Push attempt $i to ${{ env.DATA_REPO }}..."
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "✅ Final BMS trend data successfully pushed to ${{ env.DATA_REPO }}"
              break
            fi
            sleep 5
          done

      # -------------------------------------------------
      # 8. Fast Direct Deploy to Cloudflare Pages (Optional)
      # -------------------------------------------------
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          npx wrangler pages project create bmstrend --production-branch=main || true
          npx wrangler pages deploy data_repo --project-name=bmstrend --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
