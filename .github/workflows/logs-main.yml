name: MOVIE TELEMETRY PIPELINE

on:
 
  workflow_dispatch:

concurrency:
  group: movie-telemetry-${{ github.ref }}
  cancel-in-progress: false

# 🌍 GLOBAL ENV - REPOSITORY CONFIGURATION
env:
  DATA_REPO: MintBox04/LogsMain

permissions:
  contents: write

jobs:
# =====================================================
# 1️⃣ TELEMETRY PIPELINE (MintBox04/LogsMain)
# =====================================================
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # 1. Clone Target Repository (MintBox04/LogsMain)
      - name: Clone LogsMain Repository
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.DATA_REPO }}.git repo
          else
            git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.DATA_REPO }}.git repo
          fi

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          pip install --no-cache-dir brotli pytz

      # 4. Execute Incremental Update (Today, Tomorrow, Target Date)
      - name: Run Telemetry Live Update
        run: |
          cd repo
          export DATA_DIR="$(pwd)"
          if [ -n "${{ github.event.inputs.target_dates }}" ]; then
            export FUTURE_TARGET_DATES="${{ github.event.inputs.target_dates }}"
          fi

          echo "=================================================="
          echo "🚀 Running Telemetry Live Update (Today, Tomorrow, Target Date)"
          echo "=================================================="
          python telemetry_incremental_update.py

      # 5. Commit & Push Data to MintBox04/LogsMain (With Auto-Rebase Retry)
      - name: Push Data to GitHub Repository
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove plain index.json if it ever exists (strictly .json.br only)
          rm -f index.json || true
          rm -rf LogsMain || true

          # Stage index.json.br and movies/*.json.br
          git add index.json.br movies/ .gitignore

          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Auto-update telemetry: today, tomo & target date - $CURRENT_TIME [skip ci]" || echo "No changes to commit"

          for i in {1..15}; do
            echo "Push attempt $i/15 to ${{ env.DATA_REPO }}..."
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "✅ Successfully pushed telemetry data to ${{ env.DATA_REPO }}"
              break
            fi
            sleep $((RANDOM % 5 + 3))
          done

      # 6. Publish / Update Release Assets (Release 'latest' in MintBox04/LogsMain)
      - name: Update GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          echo "=================================================="
          echo "📦 Publishing Live Assets to GitHub Release 'latest' in ${{ env.DATA_REPO }}"
          echo "=================================================="

          if gh release view latest --repo "${{ env.DATA_REPO }}" >/dev/null 2>&1; then
            echo "Release 'latest' exists. Uploading/updating assets..."
            gh release upload latest index.json.br movies/*.json.br \
              --repo "${{ env.DATA_REPO }}" \
              --clobber
          else
            echo "Creating new release 'latest'..."
            gh release create latest index.json.br movies/*.json.br \
              --repo "${{ env.DATA_REPO }}" \
              --title "Live Box Office Telemetry" \
              --notes "Auto-updated telemetry for Today (Daily/Adv), Tomorrow (Adv) and Target Date."
          fi

      # 7. Fast Direct Deploy to Cloudflare Pages (allindialogsmain.pages.dev)
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create allindialogsmain --production-branch=main || true
          npx wrangler pages deploy repo --project-name=allindialogsmain --branch=main --commit-dirty=true
