name: SRILANKA

on:
  workflow_dispatch:

# 🔥 prevent overlapping runs
concurrency:
  group: srilanka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mode: [daily, advance]

    env:
      REPO: MintBox04/srilanka

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git
      # 🐍 Setup Python
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 📦 Install dependencies (Force install playwright)
      - name: Install dependencies
        run: |
          cd srilanka
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install playwright
      # 💾 Cache Playwright browsers
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('srilanka/requirements.txt') }}-${{ steps.setup-python.outputs.python-version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # 📥 Install Playwright Chromium with dependencies
      - name: Install Playwright Chromium
        run: |
          cd srilanka
          python -m playwright install chromium --with-deps
      # 🎬 Run scraper
      - name: Run scraper
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          cd srilanka
          MODE="${{ matrix.mode }}"
          echo "🎬 Running Master Sri Lanka Scraper (srilanka.py) with mode $MODE"
          for i in {1..6}; do
            echo "Attempt $i"
            if python srilanka.py --mode "$MODE"; then
              echo "✅ Scraper finished successfully"
              break
            fi
            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done
      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          cd srilanka
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ srilanka_load_status.png || true
          git commit -m "${{ matrix.mode }} update ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"
          sleep $((RANDOM % 10))
          for i in {1..5}; do
            echo "Push attempt $i"
            git pull --rebase origin main || true
            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
