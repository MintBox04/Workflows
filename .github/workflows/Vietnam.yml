name: Vietnam Box Office Update

on:
  workflow_dispatch:
  schedule:
    # 🕒 Hourly update (at minute 15 of every hour)
    - cron: "15 * * * *"

# 🔥 Prevent overlapping runs
concurrency:
  group: vietnam-box-office-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-logs:
    runs-on: ubuntu-latest

    env:
      REPO: MintBox04/vietnam

    steps:
      # 🔒 Clone Private Repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 🐍 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd vietnam
          python -m pip install --upgrade pip
          pip install beautifulsoup4 tabulate requests pytz
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 🚀 Run update script (supports vietnam.py or vitenam.py)
      - name: Run update script
        run: |
          cd vietnam
          if [ -f "vitenam.py" ]; then
            python vitenam.py
          elif [ -f "vietnam.py" ]; then
            python vietnam.py
          elif [ -f "src/vitenam.py" ]; then
            python src/vitenam.py
          elif [ -f "src/vietnam.py" ]; then
            python src/vietnam.py
          else
            echo "❌ Script not found! Current directory contains:"
            ls -la
            exit 1
          fi

      # 💾 Commit & Push
      - name: Commit and push changes
        run: |
          cd vietnam
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 🧹 Clean up pycache
          find . -name "*.pyc" -delete || true
          find . -name "__pycache__" -type d -exec rm -rf {} + || true

          git add data/ || true

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Vietnam box office data ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

          for i in {1..5}; do
            echo "Push attempt $i"

            git pull --rebase --autostash origin main || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi

            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done

